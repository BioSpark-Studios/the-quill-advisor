[package]
name = "quill-advisor"
version = "0.1.0"
edition = "2021"
description = "The Quill Advisor desktop shell (Tauri v2)."
authors = ["BioSpark Studios", "Phantori"]
license = "LicenseRef-Quill-Advisor"

# Detached from the root workspace: this package only builds where a system
# WebView (webkit2gtk on Linux) is available, so it keeps its own Cargo.lock and
# stays out of the portable logic-crate workspace.
[workspace]

[lib]
name = "quill_advisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

quill-core = { path = "../crates/quill-core" }
quill-plugin = { path = "../crates/quill-plugin" }
quill-storage = { path = "../crates/quill-storage" }
quill-ai = { path = "../crates/quill-ai" }
ed25519-dalek = "2"
