[workspace]
resolver = "2"
members = [
    "crates/quill-core",
    "crates/quill-plugin",
    "crates/quill-storage",
    "crates/quill-ai",
    # "src-tauri" is added once its deps are wired; it only builds where
    # webkit2gtk is present, so it stays out of the portable test workspace.
]
# The Tauri app is only buildable where webkit2gtk is present; the logic crates
# below build and test anywhere. Default members keep `cargo test` at the root
# focused on the portable, correctness-critical crates.
default-members = [
    "crates/quill-core",
    "crates/quill-plugin",
    "crates/quill-storage",
    "crates/quill-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Quill-Advisor"
authors = ["BioSpark Studios", "Phantori"]
repository = "https://github.com/BioSpark-Studios/the-quill-advisor"

[workspace.dependencies]
# Internal crates
quill-core = { path = "crates/quill-core" }
quill-plugin = { path = "crates/quill-plugin" }
quill-storage = { path = "crates/quill-storage" }
quill-ai = { path = "crates/quill-ai" }

# Shared external dependencies (single source of truth for versions)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
ed25519-dalek = "2"
hex = "0.4"
